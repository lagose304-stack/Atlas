<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100" fill="none">
  <defs>
    <!-- Sombra base -->
    <radialGradient id="baseShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente cuerpo calabaza -->
    <radialGradient id="pumpGrad" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="25%" stop-color="#fb923c" />
      <stop offset="65%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </radialGradient>

    <!-- Gradiente gajo izquierdo y derecho -->
    <radialGradient id="pumpSideGrad" cx="30%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>

    <!-- Gradiente tallo verde -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="45%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Gradiente hoja otoñal (rojo, naranja y oro) -->
    <linearGradient id="autumnLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Brillo interno de ojos y boca (luz de vela de Halloween) -->
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>

    <!-- Filtro de resplandor cálido -->
    <filter id="jackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sombra en suelo -->
  <ellipse cx="58" cy="92" rx="44" ry="7" fill="url(#baseShadow)" />

  <!-- Tallo de la calabaza -->
  <path d="M57 32 C55 24 57 14 69 11 C71 10.5 73 13 70 15 C62 18 63 24 64 32 Z" fill="url(#stemGrad)" stroke="#14532d" stroke-width="0.8" stroke-linejoin="round" />

  <!-- Zarcillo/espiral vegetal verde -->
  <path d="M64 28 Q74 24 72 31 Q70 36 76 34" fill="none" stroke="#22c55e" stroke-width="1.4" stroke-linecap="round" />

  <!-- Hoja otoñal de arce decorativa junto al tallo -->
  <g transform="translate(42, 13) rotate(-22) scale(0.68)">
    <!-- Silueta de hoja de arce -->
    <path d="M22 38 Q22 28 10 24 Q18 20 16 12 Q23 16 26 5 Q29 16 36 12 Q34 20 42 24 Q30 28 30 38 Z" fill="url(#autumnLeafGrad)" stroke="#b45309" stroke-width="0.9" stroke-linejoin="round" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.25))" />
    <!-- Nervaduras de la hoja -->
    <path d="M26 38 L26 12 M26 26 L14 21 M26 22 L37 18 M26 31 L18 29 M26 30 L34 27" stroke="#78350f" stroke-width="0.75" stroke-linecap="round" opacity="0.65" />
    <!-- Tallo de la hoja -->
    <path d="M26 38 Q25 44 22 47" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Cuerpo de la calabaza (gajos superpuestos para volumen tridimensional) -->
  <!-- Gajos traseros exteriores -->
  <ellipse cx="32" cy="62" rx="20" ry="24" fill="url(#pumpSideGrad)" />
  <ellipse cx="84" cy="62" rx="20" ry="24" fill="url(#pumpSideGrad)" />

  <!-- Gajos intermedios -->
  <ellipse cx="44" cy="63" rx="19" ry="26" fill="url(#pumpGrad)" stroke="#c2410c" stroke-width="0.6" />
  <ellipse cx="72" cy="63" rx="19" ry="26" fill="url(#pumpGrad)" stroke="#c2410c" stroke-width="0.6" />

  <!-- Gajo central frontal -->
  <ellipse cx="58" cy="64" rx="19" ry="27" fill="url(#pumpGrad)" stroke="#c2410c" stroke-width="0.7" />

  <!-- Brillo/relieve superior en los gajos -->
  <path d="M43 43 C46 39 52 38 56 39 C54 44 48 45 43 43 Z" fill="#fed7aa" opacity="0.45" />
  <path d="M60 39 C64 38 70 39 73 43 C68 45 62 44 60 39 Z" fill="#fed7aa" opacity="0.4" />
  <path d="M30 45 C34 42 38 43 40 46 C36 47 32 47 30 45 Z" fill="#fed7aa" opacity="0.3" />

  <!-- Rostro tallado de Halloween con luz de vela cálida -->
  <g filter="url(#jackGlow)">
    <!-- Ojo izquierdo -->
    <path d="M43 54 L52 57 L47 64 Z" fill="url(#candleGlow)" stroke="#7c2d12" stroke-width="0.8" stroke-linejoin="round" />

    <!-- Ojo derecho -->
    <path d="M73 54 L64 57 L69 64 Z" fill="url(#candleGlow)" stroke="#7c2d12" stroke-width="0.8" stroke-linejoin="round" />

    <!-- Nariz triangular -->
    <path d="M58 63 L55 69 L61 69 Z" fill="url(#candleGlow)" stroke="#7c2d12" stroke-width="0.7" stroke-linejoin="round" />

    <!-- Sonrisa pícara con dientes -->
    <path d="M37 73 C42 81 74 81 79 73 C75 78 70 78 68 74 C66 77 62 77 60 74 C58 77 54 77 52 74 C50 78 45 78 41 74 C39 75 38 74 37 73 Z" fill="url(#candleGlow)" stroke="#7c2d12" stroke-width="0.9" stroke-linejoin="round" />
  </g>

  <!-- Pequeña hoja de roble dorada caída al pie -->
  <g transform="translate(85, 80) rotate(28) scale(0.42)">
    <path d="M12 25 C8 22 5 18 7 13 C9 14 12 14 13 11 C15 13 18 12 20 9 C22 12 25 13 27 11 C28 14 31 14 33 13 C35 18 32 22 28 25 C25 24 23 26 20 27 C17 26 15 24 12 25 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1" />
    <path d="M20 27 L20 10 M20 22 L13 18 M20 20 L27 16" stroke="#92400e" stroke-width="0.9" stroke-linecap="round" />
  </g>
</svg>
